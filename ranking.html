<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RANKING - DRAW RUN</title>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 4vh;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(0, 180, 255, 0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, rgba(80, 40, 160, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, #070b16 0%, #0c1224 50%, #0a1020 100%);
      color: #e8f4ff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body { transform-origin: center top; }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin: 0 0 14px 0;
      color: #fff;
      text-shadow:
        0 0 12px rgba(0, 229, 255, 0.7),
        0 0 28px rgba(0, 180, 255, 0.35);
    }

    .last-score-container {
      position: relative;
      background: rgba(8, 20, 40, 0.65);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 14px;
      width: 82%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(0, 180, 255, 0.12);
      box-sizing: border-box;
    }

    .last-score-label {
      position: absolute;
      left: 16px;
      font-size: 12px;
      font-weight: bold;
      color: rgba(180, 220, 255, 0.7);
      letter-spacing: 1px;
    }

    .last-score-val-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .last-score-val {
      font-family: monospace;
      font-size: 20px;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .last-score-date {
      font-size: 10px;
      color: rgba(180, 200, 220, 0.55);
      margin-top: 2px;
    }

    .ranking-container {
      background: rgba(8, 16, 32, 0.7);
      border: 1.5px solid rgba(0, 200, 255, 0.22);
      border-radius: 18px;
      padding: 10px 16px;
      width: 82%;
      max-width: 360px;
      max-height: 36vh;
      overflow-y: auto;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .ranking-container::-webkit-scrollbar { width: 5px; }
    .ranking-container::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.4);
      border-radius: 3px;
    }

    ol { list-style: none; padding: 0; margin: 0; }

    li {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      margin: 6px 0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    li:nth-child(1) {
      border-color: rgba(255, 215, 0, 0.55);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.12);
    }
    li:nth-child(2) { border-color: rgba(192, 192, 192, 0.45); }
    li:nth-child(3) { border-color: rgba(205, 127, 50, 0.5); }

    .rank-num {
      position: absolute;
      left: 16px;
      font-size: 15px;
      font-style: italic;
      color: rgba(200, 220, 255, 0.75);
    }

    .score-val {
      font-family: monospace;
      font-size: 16px;
      color: #00e5ff;
    }

    .button-container {
      display: flex;
      gap: 14px;
      margin-top: 18px;
    }

    .btn {
      padding: 11px 26px;
      text-decoration: none;
      border-radius: 24px;
      font-weight: bold;
      font-size: 14px;
      border: none;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      letter-spacing: 1px;
      transition: transform 0.12s, box-shadow 0.2s;
    }

    .btn:active { transform: scale(0.96); }

    .back-btn {
      background: transparent;
      color: #00e5ff;
      border: 1.5px solid #00e5ff;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.25);
    }
    .back-btn:hover {
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.45);
      background: rgba(0, 229, 255, 0.08);
    }

    .reset-btn {
      background: rgba(255, 60, 80, 0.08);
      color: #ff8a9a;
      border: 1px solid rgba(255, 80, 100, 0.4);
    }
  </style>
</head>
<body>

  <h1>RANKING</h1>

  <div class="last-score-container">
    <span class="last-score-label">前回の記録</span>
    <div class="last-score-val-area">
      <span class="last-score-val" id="last-score-display">0 m</span>
      <span class="last-score-date" id="last-date-display"></span>
    </div>
  </div>

  <div class="ranking-container">
    <ol id="ranking-list"></ol>
  </div>

  <div class="button-container">
    <button class="btn reset-btn menu-btn" id="reset-btn">リセット</button>
    <a href="index.html" class="btn back-btn menu-btn">BACK</a>
  </div>

  <audio id="setting-bgm" src="title.mp3" loop></audio>
  <audio id="sfx-button" src="sfx_button.mp3" preload="auto"></audio>
<script>
    function adjustScale() {
      const scale = Math.min(window.innerWidth / 400, window.innerHeight / 700);
      document.body.style.transform = `scale(${scale > 1 ? 1 : scale})`;
    }
    window.addEventListener("load", adjustScale);
    window.addEventListener("resize", adjustScale);

    const settingBgm = document.getElementById("setting-bgm");
    const sfxButton = document.getElementById("sfx-button");

    function isSeEnabled() {
      return (localStorage.getItem("drawRunSeEnabled") ?? sessionStorage.getItem("drawRunSeEnabled")) !== "false";
    }

    function getSeVolume() {
      const saved = localStorage.getItem("drawRunSeVolume") ?? sessionStorage.getItem("drawRunSeVolume");
      const value = Number(saved);
      if (!Number.isFinite(value)) return 0.28;
      return Math.max(0, Math.min(100, value)) / 100;
    }

    function playButtonSfx() {
      if (!sfxButton || !isSeEnabled()) return;
      const volume = getSeVolume();
      if (volume <= 0) return;
      sfxButton.volume = volume;
      sfxButton.currentTime = 0;
      sfxButton.play().catch(() => {});
    }

    const menuButtons = document.querySelectorAll(".menu-btn");
    menuButtons.forEach((btn) => {
      btn.addEventListener("pointerdown", () => playButtonSfx());
      btn.addEventListener("click", (e) => {
        if (e.detail === 0) playButtonSfx();
        if (btn.tagName === "A" || btn.href) {
          e.preventDefault();
          const targetUrl = btn.href;
          setTimeout(() => { window.location.href = targetUrl; }, 250);
        }
      });
    });

    function loadRankingData() {
      const list = document.getElementById("ranking-list");
      const lastScoreEl = document.getElementById("last-score-display");
      const lastDateEl = document.getElementById("last-date-display");
      list.innerHTML = "";

      let scores = [];
      try {
        scores = JSON.parse(localStorage.getItem("drawRunScores")) || [];
      } catch (e) {}

      if (scores.length === 0) {
        const li = document.createElement("li");
        li.innerHTML = '<span style="color:rgba(180,200,220,0.5);font-weight:normal;">まだ記録がありません</span>';
        list.appendChild(li);
      } else {
        scores.slice(0, 5).forEach((entry, i) => {
          const li = document.createElement("li");
          const score = typeof entry === "object" ? entry.score : entry;
          li.innerHTML = `<span class="rank-num">${i + 1}</span><span class="score-val">${score} m</span>`;
          list.appendChild(li);
        });
      }

      try {
        const last = JSON.parse(localStorage.getItem("drawRunLastScore"));
        if (last) {
          lastScoreEl.textContent = (last.score != null ? last.score : last) + " m";
          if (last.date) lastDateEl.textContent = last.date;
        }
      } catch (e) {}
    }

    loadRankingData();

    const resetBtn = document.getElementById("reset-btn");
    resetBtn.addEventListener("click", () => {
      if (confirm("本当にランキングと前回の記録をリセットしますか？")) {
        localStorage.removeItem("drawRunScores");
        localStorage.removeItem("drawRunLastScore");
        loadRankingData();
      }
    });

    const savedVolume = localStorage.getItem("drawRunBgmVolume");
    const savedPlayState = localStorage.getItem("drawRunBgmPlaying");
    const savedCurrentTime = localStorage.getItem("drawRunBgmCurrentTime");
    let isPlaying = savedPlayState !== "false";
    if (savedVolume !== null) settingBgm.volume = savedVolume / 100;
    else settingBgm.volume = 0.5;
    if (savedCurrentTime !== null) settingBgm.currentTime = parseFloat(savedCurrentTime);
    if (isPlaying) settingBgm.play().catch(() => {});
    else settingBgm.pause();
    window.addEventListener("beforeunload", () => {
      localStorage.setItem("drawRunBgmCurrentTime", settingBgm.currentTime);
    });
  </script>
</body>
</html>
